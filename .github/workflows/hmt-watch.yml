name: HMT Kohinoor stock watch

# GitHub's minimum schedule interval is 5 minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:  # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write  # needed to commit state.json / last_check.txt back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check HMT stock
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python hmt_github_action.py

      # Commit state + heartbeat every run. This also keeps the repo "active"
      # so GitHub never auto-disables the schedule for inactivity.
      - name: Save state
        run: |
          git config user.name "hmt-watch"
          git config user.email "hmt-watch@local"
          git add state.json last_check.txt
          git diff --staged --quiet || git commit -m "stock check $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

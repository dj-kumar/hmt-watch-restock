name: HMT Kohinoor stock watch

on:
  # Main trigger: cron-job.org calls the workflow_dispatch API every 2 minutes.
  workflow_dispatch:
    inputs:
      test_discord:
        description: "Send a test message to Discord instead of checking stock"
        type: boolean
        default: false
  # Backup in case the external trigger stops. GitHub often delays or skips
  # frequent schedules, so this is a safety net, not the main clock.
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write  # needed to commit state.json / last_check.txt back

# Never run two checks at once (external trigger + backup schedule could
# overlap); a queued run waits instead of racing on the git push.
concurrency:
  group: hmt-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check HMT stock
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_TEST_MESSAGE: ${{ inputs.test_discord }}
        run: python hmt_github_action.py

      # Commits only when stock status changes, plus a once-a-day heartbeat
      # (last_check.txt) so GitHub doesn't disable the workflow for inactivity.
      - name: Save state
        if: ${{ inputs.test_discord != true }}
        run: |
          git config user.name "hmt-watch"
          git config user.email "hmt-watch@local"
          git add state.json last_check.txt
          if ! git diff --staged --quiet; then
            git commit -m "stock check $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi
